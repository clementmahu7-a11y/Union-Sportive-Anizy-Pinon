name: USAP Convocations - official PDF forms
on:
  workflow_dispatch:
  push:
    paths:
      - "convocations/index.html"
      - ".github/workflows/usap-convocations.yml"
permissions:
  contents: write
jobs:
  sync-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official District Aisne forms
        shell: bash
        run: |
          set -u
          mkdir -p convocations/templates
          get_pdf() {
            url="$1"; out="$2"
            enc=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$url")
            for candidate in \
              "$url" \
              "https://api.allorigins.win/raw?url=$enc" \
              "https://corsproxy.io/?url=$enc" \
              "https://cors.isomorphic-git.org/$url"
            do
              echo "Trying $candidate"
              if curl -LfsS --max-time 45 -A "Mozilla/5.0" "$candidate" -o "$out.tmp"; then
                if [ "$(head -c 4 "$out.tmp")" = "%PDF" ]; then mv "$out.tmp" "$out"; return 0; fi
              fi
            done
            echo "Unable to download $url" >&2
            return 1
          }
          get_pdf "https://aisne.fff.fr/wp-content/uploads/sites/83/2026/09/Feuille-de-Presence-U6-U7.pdf" convocations/templates/u6-u7.pdf
          get_pdf "https://aisne.fff.fr/wp-content/uploads/sites/83/2026/09/Feuille-dengagement-U8-U9.pdf" convocations/templates/u8-u9.pdf
          get_pdf "https://aisne.fff.fr/wp-content/uploads/sites/83/2026/09/Feuille-dengagement-U11.pdf" convocations/templates/u10-u11.pdf
          get_pdf "https://aisne.fff.fr/wp-content/uploads/sites/83/2026/09/Feuille-de-challenge-U13.pdf" convocations/templates/u12-u13.pdf
      - name: Commit PDF forms
        run: |
          git config user.name "USAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add convocations/templates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add official District Aisne convocation forms"
          git push
